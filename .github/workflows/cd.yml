name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client and check API
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://brewlite:brewlite@127.0.0.1:5432/brewlite?schema=public
        run: |
          npm run db:generate
          npm run lint
          npm run test -- --maxWorkers=1
          npm run test:e2e -- --maxWorkers=1
          npm run build

      - name: Check Web
        working-directory: apps/web
        run: |
          npm run lint
          npm run test -- --maxWorkers=1
          npm run build

  db-operations-gate:
    name: DB operations and deploy script checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BREWLITE_DB_OPERATIONS_TESTS: "1"
      BREWLITE_MIGRATE_TEST_IMAGE: brewlite-db-ops-migrate:cd-gate
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Check shell and DB script syntax
        run: |
          bash -n deploy/scripts/deploy.sh deploy/scripts/mark-release.sh deploy/scripts/rollback.sh
          for file in scripts/db/*.mjs; do node --check "$file"; done
          docker compose config --quiet

      - name: Build migration artifact from apps/api context
        run: docker build --target migration --tag "$BREWLITE_MIGRATE_TEST_IMAGE" ./apps/api

      - name: Test Issue #38 backup, restore, migration and rollback
        run: npm run test:db-operations

  build-and-push:
    name: Build and push images
    needs: [quality-gate, db-operations-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Normalize GHCR owner name
        shell: bash
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push brewlite-api-migrate
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          target: migration
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/brewlite-api-migrate:${{ github.sha }}
          cache-from: type=gha,scope=api-migrate
          cache-to: type=gha,mode=max,scope=api-migrate

      - name: Build and push brewlite-api
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/brewlite-api:${{ github.sha }}
          cache-from: type=gha,scope=api-runtime
          cache-to: type=gha,mode=max,scope=api-runtime

      - name: Build and push brewlite-web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: |
            API_INTERNAL_URL=http://api:3001
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/brewlite-web:${{ github.sha }}
          cache-from: type=gha,scope=web-runtime
          cache-to: type=gha,mode=max,scope=web-runtime

  deploy:
    name: Deploy to EC2 and verify health
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Validate deployment configuration
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          for secret_name in EC2_HOST EC2_USER EC2_SSH_KEY APP_DOMAIN; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing required GitHub secret: ${secret_name}"
              exit 1
            fi
          done

      - name: Deploy release via SSH and verify production HTTPS
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          SSH_PORT="${EC2_PORT:-22}"
          DEPLOY_PATH="${EC2_DEPLOY_PATH:-/opt/brewlite}"
          KNOWN_HOSTS_FILE="$(mktemp)"

          eval "$(ssh-agent -s)"
          cleanup() {
            rm -f "$KNOWN_HOSTS_FILE"
            ssh-agent -k >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' | ssh-add -
          ssh-keyscan -p "$SSH_PORT" -H "$EC2_HOST" > "$KNOWN_HOSTS_FILE"

          SSH_OPTS=(
            -p "$SSH_PORT"
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE"
            -o ConnectTimeout=20
            -o BatchMode=yes
          )

          # Transfer Compose, Caddy, deploy scripts, Issue #38 DB scripts, and reviewed migrations atomically.
          tar -czf - \
            compose.prod.yaml \
            deploy/caddy/Caddyfile \
            deploy/scripts/deploy.sh \
            deploy/scripts/mark-release.sh \
            deploy/scripts/rollback.sh \
            scripts/db \
            apps/api/prisma/migrations \
          | ssh "${SSH_OPTS[@]}" "${EC2_USER}@${EC2_HOST}" \
            "mkdir -p '$DEPLOY_PATH' && rm -rf '$DEPLOY_PATH/apps/api/prisma/migrations' '$DEPLOY_PATH/scripts/db' && tar -C '$DEPLOY_PATH' -xzf -"

          printf '%s\n' "$GHCR_TOKEN" | ssh "${SSH_OPTS[@]}" "${EC2_USER}@${EC2_HOST}" \
            "docker login ghcr.io -u '$GHCR_ACTOR' --password-stdin"

          remote_status=0
          ssh "${SSH_OPTS[@]}" "${EC2_USER}@${EC2_HOST}" \
            "chmod +x '$DEPLOY_PATH/deploy/scripts/deploy.sh' '$DEPLOY_PATH/deploy/scripts/mark-release.sh' '$DEPLOY_PATH/deploy/scripts/rollback.sh' && \
             DEPLOY_DIR='$DEPLOY_PATH' \
             IMAGE_REGISTRY_OWNER='${IMAGE_REGISTRY_OWNER,,}' \
             '$DEPLOY_PATH/deploy/scripts/deploy.sh' --schema-reviewed '$IMAGE_TAG'" || remote_status=$?

          ssh "${SSH_OPTS[@]}" "${EC2_USER}@${EC2_HOST}" \
            "docker logout ghcr.io >/dev/null 2>&1 || true"

          if [[ "$remote_status" -ne 0 ]]; then
            exit "$remote_status"
          fi

          echo "Checking public HTTPS Web, API, DB health, and BFF routes..."
          CHECK_TIMEOUT_MS=120000 node scripts/check-compose.mjs \
            --api-url="https://${APP_DOMAIN}" \
            --web-url="https://${APP_DOMAIN}"

          echo "Confirming PostgreSQL port 5432 is not publicly reachable..."
          if nc -z -w 3 "$EC2_HOST" 5432; then
            echo "::error::PostgreSQL port 5432 is publicly reachable on ${EC2_HOST}!"
            exit 1
          fi

          # Promote .pending-release -> .current-release only after external HTTPS & closed-5432 checks pass.
          ssh "${SSH_OPTS[@]}" "${EC2_USER}@${EC2_HOST}" \
            "DEPLOY_DIR='$DEPLOY_PATH' '$DEPLOY_PATH/deploy/scripts/mark-release.sh' '$IMAGE_TAG'"
