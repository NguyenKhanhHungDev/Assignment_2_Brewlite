services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - brewlite_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # PostgreSQL stays strictly internal on the Compose network (no host ports).

  migrate:
    image: ${API_MIGRATE_IMAGE:?API_MIGRATE_IMAGE is required}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BFF_PROXY_SECRET: ${BFF_PROXY_SECRET:?BFF_PROXY_SECRET is required}
      PORT: 3001
      ZALOPAY_APP_ID: ${ZALOPAY_APP_ID:-554}
      ZALOPAY_KEY1: ${ZALOPAY_KEY1:-8NdU5pG5R2spGHGhyO99HN1OhD8IQJBn}
      ZALOPAY_KEY2: ${ZALOPAY_KEY2:-uUfsWgfLkRLzq6W2uNXTCxrfxs51auny}
      ZALOPAY_API_BASE_URL: ${ZALOPAY_API_BASE_URL:-https://sb-openapi.zalopay.vn}
      ZALOPAY_CALLBACK_URL: ${ZALOPAY_CALLBACK_URL:-https://${APP_DOMAIN}/payments/zalopay/callback}
      ZALOPAY_RETURN_URL: ${ZALOPAY_RETURN_URL:-https://${APP_DOMAIN}/payment/result}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
      BFF_PROXY_SECRET: ${BFF_PROXY_SECRET:?BFF_PROXY_SECRET is required}
      CADDY_PROXY_SECRET: ${CADDY_PROXY_SECRET:?CADDY_PROXY_SECRET is required}
      APP_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN is required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      CADDY_PROXY_SECRET: ${CADDY_PROXY_SECRET:?CADDY_PROXY_SECRET is required}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  brewlite_pg_data:
  caddy_data:
  caddy_config:
